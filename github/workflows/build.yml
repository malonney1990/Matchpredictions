name: Compilar APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir (solo la primera vez)
        run: |
          if [ -f Predicciones.zip ]; then
            unzip -o Predicciones.zip && rm Predicciones.zip
            git config user.name actions && git config user.email actions@github.com
            git add -A && git commit -m "Proyecto" && git push
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: predicciones-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - run: gradle testDebugUnitTest --stacktrace
        continue-on-error: true
